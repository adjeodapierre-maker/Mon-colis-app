name: Build MON Colis Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Vérifier la structure du projet
        run: |
          echo "=== Structure du projet ==="
          ls -la
          echo ""
          echo "=== Contenu de lib ==="
          ls -la lib
          echo ""

      - name: Rechercher les URLs Supabase
        run: |
          echo "=== Recherche de l'URL INCORRECTE ==="
          grep -R "yljxmdxjihlvdlsxlagu" . --exclude-dir=.git --exclude="*.zip" || true

          echo ""
          echo "=== Recherche de l'URL CORRECTE ==="
          grep -R "yljxmdxjihvldslxlagu" . --exclude-dir=.git --exclude="*.zip" || true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le projet Flutter
        run: flutter analyze

      - name: Construire l'application Android
        run: flutter build apk --release

      - name: Vérifier que l'APK existe
        run: |
          echo "=== APK généré ==="
          ls -lh build/app/outputs/flutter-apk/
          file build/app/outputs/flutter-apk/app-release.apk

      - name: Télécharger l'APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-colis-apk
          path: build/app/outputs/flutter-apk/app-release.apk
